<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niang Challenger – Rêver, apprendre, progresser, réussir</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF8EF;--card:#fff;--ink:#141414;--mute:#5C574A;--gold:#8A6200;--g1:#FFE259;--g2:#F5A300;--line:#E4DDC9;--ok:#12805A;--ko:#B3402F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0A;--card:#151515;--ink:#F5F5F2;--mute:#B5B1A3;--gold:#FFD21F;--line:#2B2A24;--ok:#3DDC97;--ko:#FF8A78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0A0A;--card:#151515;--ink:#F5F5F2;--mute:#B5B1A3;--gold:#FFD21F;--line:#2B2A24;--ok:#3DDC97;--ko:#FF8A78;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.55}
#app{max-width:480px;margin:0 auto;padding:16px 16px 110px}
h1,h2,.brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-style:italic;font-weight:700;letter-spacing:.01em}
h1{font-size:2.2rem;line-height:1.05;margin:10px 0}
h2{font-size:1.5rem;margin:24px 0 10px}
p{margin:0 0 12px;max-width:62ch}
.lead{color:var(--mute);font-size:1.05rem}
.logo{display:block;border-radius:50%;box-shadow:0 0 26px rgba(255,210,31,.35)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}.top .brand{font-size:1.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#141414;border:0;border-radius:20px;padding:20px}
.hero h2{margin-top:2px}.hero p{color:#141414}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#141414;border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:1.05rem;text-align:center}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.dark{background:#141414;color:#FFD21F}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;font-size:1.05rem}
.opt.good{border-color:var(--ok)}.opt.bad{border-color:var(--ko)}.opt .em{font-size:1.6rem}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{text-align:center}.stat b{display:block;font-size:1.6rem}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2))}
.les{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.done{color:var(--ok);font-weight:700}
.keep{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--g2);border-radius:10px;padding:12px 14px;margin:14px 0}
.fb{font-weight:700;margin:6px 0 14px}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:14px;max-width:88%;background:var(--card);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--g1),var(--g2));color:#141414;border:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:8px 12px}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;background:none;border:0;padding:10px 4px 8px;color:var(--mute);font-size:.85rem}
nav button span{display:block;font-size:1.4rem}
nav button[aria-current="page"]{color:var(--gold);font-weight:700}
.badge{display:inline-block;margin:0 8px 8px 0;padding:8px 12px;border-radius:20px;border:2px solid var(--line);color:var(--mute)}
.badge.on{border-color:var(--g2);color:var(--ink);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;display:none;z-index:5}
.chip.sel{border-color:var(--g2);font-weight:700}nav button{font-size:.8rem}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" aria-label="Navigation principale"></nav>
<div id="toast" role="status" aria-live="polite"></div>

{id:"f",n:"Argent",e:"💶",d:"Budget, épargne, protection",L:[
{t:"Où va ton argent ?",x:"Avant de planifier, il faut observer. Pendant trois jours, note chaque dépense, même un café. Le but n’est pas de te juger : c’est de transformer un flou en chiffres que tu peux piloter.",k:"Ce qu’on mesure, on peut l’améliorer.",q:"Pourquoi noter toutes ses dépenses ?",o:["Pour se punir","Pour voir où part l’argent","Pour dépenser plus"],a:1,act:"Note ta première dépense d’aujourd’hui dans ton téléphone."},
{t:"La règle 50/30/20",x:"Répartis ton revenu en trois parts : 50 % pour l’essentiel (logement, repas, transport), 30 % pour tes envies, 20 % pour ton avenir (épargne, dettes). C’est un repère, pas une loi. Si 20 % est trop, commence à 5 %.",k:"Épargner peu mais régulièrement vaut mieux qu’attendre le moment parfait.",q:"Quelle part va à l’avenir dans cette règle ?",o:["10 %","20 %","50 %"],a:1,act:"Calcule 5 % de ton revenu mensuel : c’est ton premier objectif."},
{t:"Repérer une arnaque",x:"Les arnaques jouent sur l’urgence et sur le rêve d’un gain facile. Un gain garanti sans risque n’existe pas. Ta banque ne te demandera jamais tes codes secrets.",k:"Dans le doute, stoppe, respire et vérifie auprès d’une source officielle.",q:"Un inconnu promet 30 % de gain garanti. Que fais-tu ?",o:["J’investis vite","Je me méfie et je vérifie","Je donne mes codes"],a:1,act:"Retiens 3 signaux d’alerte : urgence, gain garanti, demande de codes."}]},
{id:"i",n:"IA",e:"🤖",d:"Utiliser l’IA avec méthode",L:[
{t:"Parler clairement à l’IA",x:"Une IA répond à la qualité de ta demande. Donne trois éléments : ton contexte (qui tu es), ton objectif (ce que tu veux) et le format (court, liste, étapes).",k:"Contexte + objectif + format = une réponse utile.",q:"Quelle demande est la meilleure ?",o:["Parle-moi d’épargne","Explique-moi l’épargne en 5 lignes simples, pour un débutant","Épargne ?"],a:1,act:"Pose à une IA une question de ta vie réelle, avec contexte et format."},
{t:"Un rôle et un exemple",x:"Demande à l’IA de jouer un rôle précis (« agis comme un conseiller budget ») et montre un exemple du résultat attendu. Tu gagnes en précision et tu évites les réponses vagues.",k:"Un rôle et un exemple valent mieux que dix reformulations.",q:"À quoi sert de donner un exemple ?",o:["À montrer le style voulu","À rallonger la réponse","À rien"],a:0,act:"Reprends ta dernière demande et ajoute un rôle et un exemple."},
{t:"Toujours vérifier",x:"L’IA peut se tromper avec beaucoup d’assurance. Pour un chiffre, une loi ou une décision financière, recoupe avec un site officiel. Utilise-la comme une assistante, pas comme un juge.",k:"L’IA propose, c’est toi qui décides.",q:"L’IA te donne un taux d’impôt. Que fais-tu ?",o:["Je le crois","Je vérifie sur un site officiel","Je l’ignore toujours"],a:1,act:"Choisis une réponse d’IA récente et vérifie un fait."}]},
{id:"h",n:"Habitudes",e:"🌱",d:"Progresser sans t’épuiser",L:[

else if(a=="send"){const v=$("#in").value.trim();if(!v)return;const l=v.toLowerCase();return ask(/budget|argent|dépense/.test(l)?"b":/\bia\b|prompt|chatgpt/.test(l)?"i":/habitude|motiv|routine/.test(l)?"h":/rêve|reve|objectif/.test(l)?"r":/épargn|économ/.test(l)?"n":"d",v)}
else if(a=="chk"){const w=wk();w.c[+r]=w.c[+r]?0:1;if(w.c.every(Boolean)&&!w.p){w.p=1;S.pts+=30;S.chd=(S.chd||0)+1;toast("Défi réussi : +30 points")}save()}
else if(a=="cur"){S.cur=r;save()}
else if(a=="bc"){bc=r;document.querySelectorAll('[data-a^="bc:"]').forEach(b=>b.classList.toggle("sel",b.dataset.a=="bc:"+bc));return}
else if(a=="addex"){const l=$("#exl").value.trim(),v=parseFloat($("#exa").value);if(!l||!(v>0))return toast("Écris une description et un montant");S.ex.push({id:Date.now(),l:l.slice(0,40),a:v,c:bc,d:new Date().toISOString().slice(0,7)});if(S.ex.length>300)S.ex.shift();save()}
else if(a=="delex"){S.ex=S.ex.filter(e=>e.id!=r);save()}
else if(a=="sz"){S.sz=Math.max(-1,Math.min(3,S.sz+ +r));save();prefs()}
else if(a=="th"){S.th=r;save();prefs()}
else if(a=="reset"){S={goal:null,dream:"",done:{},pts:0,streak:0,last:"",sz:0,th:"dark",cur:"XOF",inc:0,ex:[],wk:{id:"",c:[0,0,0],p:0},chd:0};save();prefs();view="dream"}
render();if(!["sz","th","chk","addex","delex","cur"].includes(a))window.scrollTo(0,0)});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="in")document.querySelector('[data-a="send"]').click()});
document.addEventListener("change",e=>{if(e.target.id=="inc"){S.inc=Math.max(0,parseFloat(e.target.value)||0);save();render()}});
prefs();render();
</script>
</body>
</html>
